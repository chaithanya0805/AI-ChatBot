server:
  port: ${PORT:8083}

spring:
  application:
    name: ai-chatbot

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

brevo:
  api:
    key: ${BREVO_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

gemini:
  api:
    key: ${GEMINI_API_KEY}