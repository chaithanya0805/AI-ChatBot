server:
  port: ${PORT:8083}

spring:
  application:
    name: ai-chatbot

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

 spring:
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

gemini:
  api:
    key: ${GEMINI_API_KEY}